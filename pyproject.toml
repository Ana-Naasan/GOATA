[project]
name = "physio-motion-processing"
version = "0.1.0"
description = "Local processing service and capture/replay contracts for the Quest demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "python-multipart",
  "jsonschema",
  "PyYAML",
]

[project.optional-dependencies]
microscope = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "av>=13,<17"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "httpx", "pip-audit", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/backend", "tests/contracts", "tests/ml"]
pythonpath = ["."]

[tool.coverage.run]
source = ["processing"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
