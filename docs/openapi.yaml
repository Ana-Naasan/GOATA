openapi: 3.1.0
info:
  title: Physio Motion Replay processing service
  version: 0.1.0
  description: |
    Local transfer, job mechanics, and configured real inference are implemented.
    Without an inference command, accepted full-body captures fail with
    PROCESSING_FAILED while preserving originals. Historical barefoot jobs without
    a replay can succeed with unavailable assessment. No validated clinical model is claimed.
    The Quest app owns patient profiles and history. This service processes one
    immutable capture bundle at a time and returns versioned artifacts. Display
    names are not uploaded. A successful job means its result was saved, not that
    every analysis was available or clinically validated.

    Require TLS outside loopback and a deployment-specific bearer token loaded
    from the environment. Never commit the token or log authorization headers or media.
    Demo authentication grants access to this deployment's jobs. It is not a
    production multi-clinic authorization system. Do not expose it publicly.

    Default hard limits: 512 MiB ZIP upload, 1 MiB manifest UTF-8, 1 GiB total
    extracted files, 64 ZIP entries, 8 takes. Enforce limits while streaming,
    including when Content-Length is absent. Reject encrypted archives, duplicate
    names, symlinks, directories, nested archives, traversal and unlisted members.
    Check file signatures, declared size and SHA-256 before processing. Media
    signature checks do not prove decoding or source-frame alignment. A real
    inference adapter must validate those with bounded decoder resources before
    model execution. Configured service inference requires the sidecar media
    timestamp mapping and passes --pts-offset-ns 0 to the local command. ZIP64 and compression other than STORE or DEFLATE are rejected.
    Sidecar and replay JSON is bounded to 16 MiB. Total result output is bounded to 1 GiB.
    One upload is validated at a time, with a 120-second receive deadline.
    Multipart overhead is bounded to 64 KiB above ZIP+manifest limits. Part
    headers are bounded to 16 KiB. Private storage defaults to an 8 GiB budget
    with space reserved before acceptance. Configure and record changed limits.

    Persist accepted job state before responding. On restart mark any pending or
    running job failed with WORKER_INTERRUPTED. Preserve source evidence and
    previous successful results. Never silently resume half-written output.
    Publish result artifacts atomically before marking the job succeeded.

    The 60-120 second capture-to-loaded-replay target includes upload, processing,
    download and Quest loading. It is a benchmark target, not a service guarantee.
servers:
  - url: /
    description: Same origin. Configure the actual HTTPS processing host in the app.
security:
  - bearerAuth: []
tags:
  - name: jobs
    description: Capture processing and immutable results.
paths:
  /v1/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Validate and accept a capture bundle
      description: |
        Accept one active job per deployment. A second distinct job returns 429.
        pending is the persisted pre-start state, not an unbounded queue.
        Multipart has a UTF-8 JSON text form field and a ZIP file. Parse manifest
        as CaptureManifest and run its cross-reference checks before acceptance.
        Reject duplicate JSON keys, nonfinite numbers and unknown properties.
        No arbitrary file paths, remote URLs, executables or pickled data accepted.

        Scope idempotency to this deployment and the supplied key. Store a digest
        of server-canonical manifest JSON plus the ordered member names, sizes and
        verified hashes (ZIP container bytes need not match). Canonicalize after
        validation using sorted object keys, compact JSON and UTF-8. Only the
        service computes this digest. The same key and
        same contents returns the original Job, even if it is now terminal.
        The same key with different contents returns 409. Reprocessing requires
        a new key and creates a new job and result. It never overwrites a saved result.
        Check an existing idempotency record before rejecting for worker capacity.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [manifest, media]
              properties:
                manifest:
                  type: string
                  maxLength: 1048576
                  contentMediaType: application/json
                  contentSchema: {$ref: '#/components/schemas/CaptureManifest'}
                  description: JSON text. Validate explicitly after form parsing.
                media:
                  type: string
                  format: binary
                  description: ZIP containing exactly the InputFile members.
            encoding:
              manifest: {contentType: 'text/plain; charset=utf-8'}
              media: {contentType: application/zip}
      responses:
        '202':
          description: Accepted, or idempotent replay of the existing job.
          headers:
            Location:
              schema: {type: string}
              description: Relative /v1/jobs/{job_id} path.
            Retry-After:
              schema: {type: integer, minimum: 1}
              description: Suggested polling delay in seconds. Initially 2.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: IDEMPOTENCY_CONFLICT. The key belongs to different input.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '413':
          description: UPLOAD_TOO_LARGE. An upload or extraction limit was exceeded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: VALIDATION_ERROR. The request contains malformed JSON, an unsafe ZIP, or an invalid capture.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '429':
          description: CAPACITY_EXCEEDED. The worker is occupied or a configured request limit was reached.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/jobs/{job_id}:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
    get:
      tags: [jobs]
      operationId: getJob
      summary: Read actual processing state
      description: |
        Poll at the response Retry-After interval, with capped backoff on network
        failure. Status survives service restart. A timeout does not create a new
        job. No estimated percentage is returned as measured progress.
      responses:
        '200':
          description: Current persisted job state.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
              description: Polling delay for pending or running jobs. Omit for terminal jobs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/jobs/{job_id}/result:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
    get:
      tags: [jobs]
      operationId: getResult
      summary: Fetch the completed result manifest
      description: |
        Available only for succeeded jobs. Return 409 NOT_READY for pending or
        running. Return 409 PROCESSING_FAILED for failed. Check feature availability
        before showing findings, replay or microscope actions. A new processing
        attempt gets a new result_id. The app validates all IDs before associating
        the downloaded result with its local patient and session.
      responses:
        '200':
          description: Immutable result manifest. Binary data is fetched separately.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResultManifest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Result is not available. The error identifies why.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/jobs/{job_id}/artifacts/{artifact_id}:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
      - name: artifact_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [jobs]
      operationId: getArtifact
      summary: Download one allowlisted artifact from a completed job
      description: |
        Resolve the opaque ID through this job's persisted artifact index.
        Reject IDs from another job. Never accept a filesystem path or external
        URL. Serve only complete artifacts. The client verifies byte count and
        SHA-256 before moving its temporary download into the saved session.
        No range requests or resumed downloads is required for this first demo.
      responses:
        '200':
          description: Bytes with the media type declared in Artifact.
          headers:
            Content-Length:
              schema: {type: integer, minimum: 0}
            X-Content-SHA256:
              schema: {$ref: '#/components/schemas/Sha256'}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            application/json:
              schema: {type: object}
            video/mp4:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: NOT_READY or PROCESSING_FAILED. The job has no published artifacts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-deployment secret. Configure separately from source control.
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Unauthorized:
      description: UNAUTHORIZED. The bearer token is missing or invalid.
      headers:
        WWW-Authenticate:
          schema: {type: string, const: Bearer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: NOT_FOUND. The job or artifact is unknown, including artifact IDs from another job.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    InternalError:
      description: INTERNAL_ERROR. The message is sanitized and includes request_id for local diagnostics.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    TestType:
      type: string
      enum: [elk, rtk, walking, barefoot]
    InputFile:
      type: object
      additionalProperties: false
      required: [member, sha256, byte_size]
      properties:
        member:
          type: string
          pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}\.(mp4|json)$'
          description: Flat ZIP member with a UUID filename. Check extension against actual content.
        sha256: {$ref: '#/components/schemas/Sha256'}
        byte_size: {type: integer, minimum: 1, maximum: 1073741824}
    CaptureManifest:
      type: object
      additionalProperties: false
      required: [schema_version, session_id, patient_id, test_type, protocol_id, protocol_version, capture_completed_at, takes]
      description: |
        IDs are UUIDs generated by the Quest app. All take IDs and ZIP member
        names must be unique. Every file must be referenced exactly once. Every
        reference must resolve. Video references must be MP4 and frame_metadata
        references JSON, using the sidecar format specified in SPEC.md.
        The JSON sidecar preserves original frame IDs and PTS, image dimensions,
        intrinsics, available camera poses, tracking validity, and adapter version.
        Never substitute decode frame number for original capture timing.
        Optional sidecar.media records an explicit indexed_presentation_time_us
        array binding verified mux timestamps to the preserved original frames.
        The decoder verifies every timestamp before accepting that mapping.

        For elk, rtk, and walking, require a replay_take_id referencing a full_body take in this
        manifest. For barefoot require at least one foot_closeup. Optional replay
        must still reference a full_body take explicitly included here for this
        same patient. Independent repetitions remain separate takes. Do not fuse
        their motion into an averaged performance. Verify protocol and test mapping.
      properties:
        schema_version: {type: string, const: '1.0'}
        session_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
        test_type: {$ref: '#/components/schemas/TestType'}
        protocol_id:
          type: string
          enum: [elk, rtk, walking, barefoot]
          description: Must match test_type. Provisional capture identifier. This is not an evaluated clinical protocol.
        protocol_version: {type: string, const: '1.0'}
        capture_completed_at: {type: string, format: date-time}
        replay_take_id: {type: string, format: uuid}
        takes:
          type: array
          minItems: 1
          maxItems: 8
          items: {$ref: '#/components/schemas/Take'}
      allOf:
        - if:
            properties:
              test_type: {enum: [elk, rtk, walking]}
          then:
            required: [replay_take_id]
            properties:
              replay_take_id: {}
              takes:
                contains:
                  properties:
                    kind: {const: full_body}
        - if:
            properties:
              test_type: {const: walking}
          then:
            properties:
              takes:
                items:
                  properties:
                    side: {const: not_applicable}
                  oneOf:
                    - properties:
                        kind: {const: full_body}
                        condition: {const: exercise}
                    - properties:
                        kind: {const: microscope}
                        condition: {const: steady_hold}
        - if:
            properties:
              test_type: {const: barefoot}
          then:
            properties:
              takes:
                contains:
                  properties:
                    kind: {const: foot_closeup}
    Take:
      type: object
      additionalProperties: false
      required: [take_id, kind, view, condition, side, duration_s, video, frame_metadata]
      properties:
        take_id: {type: string, format: uuid}
        kind: {type: string, enum: [full_body, foot_closeup, microscope]}
        view: {type: string, enum: [front, left, right, rear, medial, other]}
        condition: {type: string, enum: [standing, seated, exercise, steady_hold]}
        side: {type: string, enum: [left, right, bilateral, not_applicable]}
        duration_s:
          type: number
          exclusiveMinimum: 0
          description: Recording duration of at least the last original PTS minus the clock origin. May include the final frame's presentation duration.
        video: {$ref: '#/components/schemas/InputFile'}
        frame_metadata: {$ref: '#/components/schemas/InputFile'}
      allOf:
        - if:
            properties:
              kind: {const: foot_closeup}
          then:
            properties:
              side: {enum: [left, right]}
              condition: {enum: [standing, seated]}
    Job:
      type: object
      additionalProperties: false
      required: [job_id, session_id, patient_id, test_type, status, stage, created_at, updated_at]
      description: |
        Jobs move from pending to running, then to succeeded or failed. An
        interrupted pending job moves directly to failed. Terminal jobs are immutable. Stages may be
        skipped only when irrelevant to the selected test. A failed job keeps its last
        stage and requires error. A succeeded job requires stage complete and result_id.
      properties:
        job_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
        test_type: {$ref: '#/components/schemas/TestType'}
        status: {type: string, enum: [pending, running, succeeded, failed]}
        stage:
          type: string
          enum: [queued, preparing_recording, estimating_movement, analysing_test, preparing_replay, complete]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        progress:
          type: object
          additionalProperties: false
          required: [completed, total, unit]
          description: Optional actual counters for this stage. completed <= total. Omit if unknown.
          properties:
            completed: {type: integer, minimum: 0}
            total: {type: integer, minimum: 1}
            unit: {type: string, enum: [frames, takes, artifacts]}
        result_id: {type: string, format: uuid}
        error: {$ref: '#/components/schemas/ErrorDetail'}
      allOf:
        - if:
            properties:
              status: {const: failed}
          then: {required: [error], properties: {error: {}}}
          else:
            not: {required: [error], properties: {error: {}}}
        - if:
            properties:
              status: {const: succeeded}
          then:
            required: [result_id]
            properties:
              result_id: {}
              stage: {const: complete}
          else:
            not: {required: [result_id], properties: {result_id: {}}}
    ResultManifest:
      type: object
      additionalProperties: false
      required: [schema_version, result_id, job_id, session_id, patient_id, test_type, created_at, pipeline_version, protocol_id, protocol_version, input_digest, validation_status, methods, features, findings, microscopes, artifacts]
      description: |
        Verify IDs, test, and protocol against the accepted capture. Every artifact ID
        must resolve within this result. All findings must reference an input
        take and valid original frames. An empty findings array is not a passing
        clinical assessment. Each requested feature reports availability and a reason.
        Full-body methods must not consume foot_closeup as full-body evidence.
        Original recording condition remains attached to each finding.
        Only evidence whose take_id equals replay.source_take_id may seek the 3D
        replay clock or activate temporal body highlights. Other-take findings
        and microscope results open their own source video labelled "Separate
        recording", with the hologram paused. Equal elapsed seconds across takes
        do not establish correspondence between performances.
      properties:
        schema_version: {type: string, enum: ['1.0', '1.1']}
        result_id: {type: string, format: uuid}
        job_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
        test_type: {$ref: '#/components/schemas/TestType'}
        created_at: {type: string, format: date-time}
        pipeline_version: {type: string, minLength: 1, maxLength: 100}
        protocol_id: {type: string, minLength: 1, maxLength: 80}
        protocol_version: {type: string, minLength: 1, maxLength: 80}
        input_digest: {$ref: '#/components/schemas/Sha256'}
        validation_status: {type: string, const: research_demo_unvalidated}
        methods:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Method'}
        features:
          type: array
          minItems: 1
          maxItems: 4
          items: {$ref: '#/components/schemas/Feature'}
        replay:
          type: object
          additionalProperties: false
          required: [source_take_id, manifest_artifact_id]
          properties:
            source_take_id: {type: string, format: uuid}
            manifest_artifact_id: {type: string, format: uuid}
        observations:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/Observation'}
        findings:
          type: array
          items: {$ref: '#/components/schemas/Finding'}
        microscopes:
          type: array
          description: Supports selecting a recorded region even when no automatic finding exists.
          items: {$ref: '#/components/schemas/Microscope'}
        artifacts:
          type: array
          items: {$ref: '#/components/schemas/Artifact'}
      allOf:
        - if:
            properties:
              schema_version: {const: '1.1'}
          then:
            required: [observations]
            properties:
              features:
                contains:
                  properties:
                    name: {const: observations}
          else:
            not: {required: [observations]}
            properties:
              features:
                items:
                  properties:
                    name: {enum: [replay, movement, foot, microscope]}
    Method:
      type: object
      additionalProperties: false
      required: [method_id, name, version, settings_artifact_id]
      description: |
        Unique method_id per result. Pin code and checkpoint versions and retain exact
        processing settings as a JSON artifact. Use method version for algorithms
        without learned weights. Do not invent a checkpoint hash.
      properties:
        method_id: {type: string, minLength: 1, maxLength: 80}
        name: {type: string, minLength: 1, maxLength: 100}
        version: {type: string, minLength: 1, maxLength: 100}
        checkpoint_sha256: {$ref: '#/components/schemas/Sha256'}
        settings_artifact_id: {type: string, format: uuid}
    Feature:
      type: object
      additionalProperties: false
      required: [name, status, detail]
      description: |
        Feature names are unique. Include replay and movement for elk, rtk, and walking, foot for barefoot and
        microscope for each test. Version 1.1 also requires observations. Available
        means at least one estimated observation, never a clinical assessment.
        For other features, available means an artifact or analysis exists.
        validation_status remains research_demo_unvalidated. Omit replay from a
        foot-only result. Reasons must distinguish poor capture, unsupported
        method, missing calibration and processing failure.
      properties:
        name: {type: string, enum: [replay, movement, foot, microscope, observations]}
        status: {type: string, enum: [available, unavailable]}
        detail: {type: string, minLength: 1, maxLength: 500}
    EvidenceInterval:
      type: object
      additionalProperties: false
      required: [take_id, start_s, end_s, first_frame_id, last_frame_id, condition, quality]
      description: |
        Source interval [start_s,end_s] in seconds from the take's first original
        PTS. end_s >= start_s and <= source duration. Frame IDs identify original
        captured frames, not resampled replay indices. Preserve gaps. Verify the
        IDs and times against the sidecar. quality is capture quality, not diagnostic
        confidence. Never convert standing evidence into a gait claim.
      properties:
        take_id: {type: string, format: uuid}
        start_s: {type: number, minimum: 0}
        end_s: {type: number, minimum: 0}
        first_frame_id: {type: integer, minimum: 0}
        last_frame_id: {type: integer, minimum: 0}
        condition: {type: string, enum: [standing, seated, exercise, steady_hold]}
        quality: {type: string, enum: [usable, limited, insufficient]}
        quality_reason: {type: string, minLength: 1, maxLength: 500}
      allOf:
        - if:
            properties:
              quality: {enum: [limited, insufficient]}
          then: {required: [quality_reason], properties: {quality_reason: {}}}
    Finding:
      type: object
      additionalProperties: false
      required: [finding_id, method_id, label_code, label, explanation, region, side, evidence, limitations, metrics]
      description: |
        label_code must belong to this evaluated label set for this protocol and model.
        Do not generate exercise corrections or treatment recommendations.
        With insufficient evidence produce an unavailable Feature instead of an
        unsupported finding. highlight_joint_names, if present, must exist in
        the replay's joint map. A foot finding does not move skeleton joints.
      properties:
        finding_id: {type: string, format: uuid}
        method_id: {type: string, minLength: 1, maxLength: 80}
        label_code: {type: string, minLength: 1, maxLength: 100}
        label: {type: string, minLength: 1, maxLength: 160}
        explanation: {type: string, minLength: 1, maxLength: 1000}
        region: {type: string, minLength: 1, maxLength: 80}
        side: {type: string, enum: [left, right, bilateral, not_applicable]}
        evidence: {$ref: '#/components/schemas/EvidenceInterval'}
        limitations:
          type: array
          items: {type: string, minLength: 1, maxLength: 500}
        metrics:
          type: array
          items: {$ref: '#/components/schemas/Metric'}
        highlight_joint_names:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 80}
        microscope_id:
          type: string
          format: uuid
          description: Optional reference to a microscope result with matching source evidence.
    Observation:
      type: object
      additionalProperties: false
      required: [observation_id, method_id, quantity_code, label, explanation, region, side, evidence, limitations, metrics]
      description: |
        Version 1.1 contains estimated geometry only. It does not contain diagnoses,
        correctness labels, or clinical confidence. A finite fitted joint is not a visibility score.
        Bind to this result's selected replay source, valid original frames and
        exact endpoint times. Never bridge a gap in the capture or replay. Quantity must
        match test_type. Knee quantities require left or right side, torso
        quantities require not_applicable. All metrics are finite pose-estimated angles
        in degrees with no physical-scale claim. Methods retain settings artifacts.
        Independently of optional highlights, torso quantities require valid left
        and right hip and shoulder joints. Knee quantities require the named side's
        hip, knee, and ankle. Every sample in the evidence interval must be valid.
      properties:
        observation_id: {type: string, format: uuid}
        method_id: {type: string, minLength: 1, maxLength: 80}
        quantity_code:
          type: string
          enum: [elk.lateral_torso_lean, rtk.shoulder_pelvis_rotation, walking.knee_flexion, walking.trunk_lean]
        label: {type: string, minLength: 1, maxLength: 160}
        explanation: {type: string, minLength: 1, maxLength: 1000}
        region: {type: string, minLength: 1, maxLength: 80}
        side: {type: string, enum: [left, right, not_applicable]}
        evidence:
          allOf:
            - {$ref: '#/components/schemas/EvidenceInterval'}
            - properties:
                quality: {const: limited}
        limitations:
          type: array
          minItems: 1
          maxItems: 8
          items: {type: string, minLength: 1, maxLength: 500}
        metrics:
          type: array
          minItems: 1
          maxItems: 4
          items:
            allOf:
              - {$ref: '#/components/schemas/Metric'}
              - properties:
                  value: {minimum: -180, maximum: 180}
                  unit: {const: deg}
                  basis: {const: pose_estimate}
                  scale_status: {const: not_required}
        highlight_joint_names:
          type: array
          maxItems: 22
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 80}
    Metric:
      type: object
      additionalProperties: false
      required: [name, value, unit, basis, scale_status]
      description: |
        Finite values only, calculated from original unamplified evidence.
        Replay resizing and speed changes never modify them. Unknown values are
        omitted, never encoded as zero. A model score is not a clinical probability.
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        value: {type: number}
        unit: {type: string, minLength: 1, maxLength: 40}
        basis: {type: string, enum: [image_measurement, pose_estimate, model_score]}
        scale_status: {type: string, enum: [calibrated, estimated, not_required]}
        scale_provenance: {type: string, minLength: 1, maxLength: 500}
      allOf:
        - if:
            properties:
              scale_status: {enum: [calibrated, estimated]}
          then: {required: [scale_provenance], properties: {scale_provenance: {}}}
    Microscope:
      type: object
      additionalProperties: false
      required: [microscope_id, method_id, evidence, region, side, status, detail]
      description: |
        Available only after checking camera-motion and noise quality. Original and
        amplified videos use this result's same source interval and crop.
        Settings artifact records crop, temporal band, amplification amount,
        stabilization and source frame mapping. Amplified pixels are illustrative.
        they never replace measurements or the main hologram's motion.
      properties:
        microscope_id: {type: string, format: uuid}
        method_id: {type: string, minLength: 1, maxLength: 80}
        evidence: {$ref: '#/components/schemas/EvidenceInterval'}
        region: {type: string, minLength: 1, maxLength: 80}
        side: {type: string, enum: [left, right, bilateral, not_applicable]}
        status: {type: string, enum: [available, unavailable]}
        detail: {type: string, minLength: 1, maxLength: 500}
        original_artifact_id: {type: string, format: uuid}
        amplified_artifact_id: {type: string, format: uuid}
        settings_artifact_id: {type: string, format: uuid}
      allOf:
        - if:
            properties:
              status: {const: available}
          then:
            required: [original_artifact_id, amplified_artifact_id, settings_artifact_id]
            properties:
              original_artifact_id: {}
              amplified_artifact_id: {}
              settings_artifact_id: {}
    Artifact:
      type: object
      additionalProperties: false
      required: [artifact_id, role, media_type, byte_size, sha256]
      description: |
        Artifact IDs are unique within the result and server-generated. The
        replay_manifest role contains replay_manifest.json as defined in SPEC.md.
        Replay binaries carry fixed topology, timestamped vertices and joints and
        explicit validity data. They contain no executable serialization.
        The client rejects decoded replay bundles over 256 MiB before allocation.
        This decoded limit includes every required array and mask, not just ZIP size.
      properties:
        artifact_id:
          type: string
          format: uuid
          pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'
          description: Server-generated canonical lowercase UUID. Use this exact ID for download.
        role:
          type: string
          enum: [replay_manifest, replay_binary, evidence_video, microscope_original, microscope_amplified, processing_settings, quality_report]
        media_type:
          type: string
          enum: [application/json, application/octet-stream, video/mp4]
        byte_size: {type: integer, minimum: 1, maximum: 1073741824}
        sha256: {$ref: '#/components/schemas/Sha256'}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
        request_id: {type: string, format: uuid}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      description: |
        Sanitized user-facing text only. It must not contain stack traces, paths, tokens, patient
        names or raw media. retryable means retry may help after the stated cause
        changes, not an instruction for an infinite automatic resubmission loop.
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UPLOAD_TOO_LARGE, UNAUTHORIZED, NOT_FOUND, NOT_READY, IDEMPOTENCY_CONFLICT, CAPACITY_EXCEEDED, PROCESSING_FAILED, WORKER_INTERRUPTED, INTERNAL_ERROR]
        message: {type: string, minLength: 1, maxLength: 500}
        retryable: {type: boolean}
